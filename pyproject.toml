# Tool settings only; dependencies are in requirements.in / requirements.txt.
# The ruff and mypy versions are pinned in requirements-dev.txt, so their default
# rule sets cannot change underneath CI.

[tool.ruff]
target-version = "py312"
# 0-byte placeholder since the first commit; not a valid notebook.
extend-exclude = ["notebooks/exploration.ipynb"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
